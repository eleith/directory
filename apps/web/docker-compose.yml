services:
  directory-app:
    image: ${DIRECTORY_IMAGE:-git.eleith.com/eleith.private/directory:latest}
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: prod
    env_file: .env
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-}
      HOST: 0.0.0.0
      PORT: '3000'
      CONFIG_PATH: /app/config/directory.yaml
      DIRECTORY_PUBLIC_DIR: /app/public
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      AUTH_URL: ${ORIGIN:-http://localhost:3000}
    ports:
      - '${DIRECTORY_BIND:-127.0.0.1}:${DIRECTORY_PORT:-3000}:3000'
    volumes:
      - ./config:/app/config:ro
      - ./public:/app/public:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  directory-cli:
    image: ${DIRECTORY_CLI_IMAGE:-git.eleith.com/eleith.private/directory-cli:latest}
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: apps/cli/Dockerfile
      target: prod
    profiles:
      - tools
    env_file: .env
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-}
      HOST: 0.0.0.0
      PORT: '3000'
      CONFIG_PATH: /app/config/directory.yaml
      DIRECTORY_PUBLIC_DIR: /app/public
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      AUTH_URL: ${ORIGIN:-http://localhost:3000}
    volumes:
      - ./config:/app/config:ro
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
