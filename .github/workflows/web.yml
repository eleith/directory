name: CI (Web App)

on:
  push:
    branches: [main]
    paths:
      - '*'
      - docs/**
      - .github/workflows/**
      - .woodpecker/**
      - apps/web/**
      - packages/**
  pull_request:
    paths:
      - '*'
      - docs/**
      - .github/workflows/**
      - .woodpecker/**
      - apps/web/**
      - packages/**

permissions:
  contents: read

jobs:
  check:
    name: Web checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web and shared dependencies
        run: pnpm --filter '@directory/web...' build
      - name: Check types
        run: pnpm --filter @directory/web check
      - name: Lint root and workspace
        run: |
          pnpm lint
          pnpm --filter @directory/web lint
      - name: Unit tests
        run: pnpm --filter @directory/web test:coverage

  e2e:
    name: Web E2E
    needs: check
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/eleith/containers-playwright:1.61.1-node26@sha256:31ca7ae8b89997e60b60dec15487ea25ac9ea7b1eea45ea967f0f873c89af1ab
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check image toolchain
        run: |
          node --version
          pnpm --version
          node --eval "if (process.versions.node !== '26.5.0') throw new Error('Expected Node 26.5.0')"
          test "$(pnpm --version)" = "11.9.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web and shared dependencies
        run: pnpm --filter '@directory/web...' build
      - name: Browser tests
        run: pnpm --filter @directory/web test:e2e

  build-push:
    name: Publish web image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check schema drift before building
        run: pnpm schema:check
      - name: Build CLI and shared dependencies
        run: pnpm --filter '@directory/cli...' build
      - name: Check config dependency
        run: |
          pnpm --filter @directory/config check
          pnpm --filter @directory/config lint
          pnpm --filter @directory/config test:coverage
      - name: Check CLI
        run: |
          pnpm --filter @directory/cli check
          pnpm --filter @directory/cli lint
          pnpm --filter @directory/cli test:coverage
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: ghcr.io/eleith/directory:latest
