name: CI (Config Package)

on:
  push:
    branches: [main]
    paths:
      - '*'
      - .changeset/**
      - docs/**
      - .github/workflows/**
      - .woodpecker/**
      - packages/config/**
      - apps/web/config/directory.example.yml
  pull_request:
    paths:
      - '*'
      - .changeset/**
      - docs/**
      - .github/workflows/**
      - .woodpecker/**
      - packages/config/**
      - apps/web/config/directory.example.yml

permissions:
  contents: read

jobs:
  test-and-build:
    name: Config checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check editor schema
        run: pnpm schema:check
      - name: Build config
        run: pnpm --filter '@directory/config...' build
      - name: Check types
        run: pnpm --filter @directory/config check
      - name: Lint root and workspace
        run: |
          pnpm lint
          pnpm --filter @directory/config lint
      - name: Unit and artifact tests
        run: pnpm --filter @directory/config test:coverage
