# Replace the placeholder addresses with your own.
# Sign-in is disabled. Uncomment one auth example below to enable it.
version: 1
site:
  # Set your public origin when deploying beyond localhost (no trailing slash).
  # url: https://directory.example.com
  title: Home Server
  description: Useful things running at home.
  footer: Something not working? Ask your household maintainer.
  # Optional public Open Graph image; generated when omitted.
  # og_image_path: /public/share.png

appearance:
  primary_light_color: '#0f766e'
  primary_dark_color: '#5eead4'

# Shared sign-in. Set site.url above to your directory's HTTPS origin.
# HTTP localhost is allowed for local testing. Restart after changing auth.
# auth:
#   credentials:
#     username: admin
#     password: replace-with-your-own-password

# Or SSO. Register this callback with your provider:
# https://directory.example.com/auth/callback/oidc
# auth:
#   oidc:
#     issuer: https://identity.example.com
#     client_id: directory
#     client_secret: replace-with-your-client-secret

# Restarts sign everyone out unless you set auth.secret. To keep sessions,
# generate a value once with: openssl rand -base64 32
# Add it inside your chosen auth block as: secret: 'your-generated-value'
# Passwords and secrets can also use '${VAR}' from an optional .env file.
# Keep files containing secrets private.

# Reserved example.com destinations are placeholders, not live integrations.
# All bookmarks use generated logos; site branding uses the bundled default.
